name: Verify ThemeScope

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements.txt"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q src scripts tests
      - run: node --check static/dashboard.js
      - run: node tests/test_dashboard.js
      - run: node --check static/vnext/app.js
      - run: node tests/test_workspace.js
      - name: Clean manual-CSV install, preservation, history and HTTP site checks
        run: python tests/smoke_local_install.py --browser

      - name: Local vNext fixture browser and refresh smoke
        run: python tests/smoke_vnext_ui.py

      - name: Pre-launch research and official-launch boundary browser smoke
        run: python tests/smoke_prelaunch_ui.py

      - name: Install local accessibility audit tool
        run: npm install --prefix runtime/ui-v3-tools --no-save --package-lock=false axe-core@4.14.0
      - name: Research v2 desktop, mobile, keyboard and accessibility gate
        run: python tests/smoke_research_v2_ui.py
      - name: Frozen public snapshot and synthetic static demo
        run: |
          python tests/smoke_public_snapshot.py
          python tests/smoke_cloudflare_demo.py
