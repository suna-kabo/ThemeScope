name: Verify ThemeScope

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q src scripts tests
      - run: node --check static/dashboard.js
      - run: node tests/test_dashboard.js
      - run: python3 scripts/generate_dashboard.py --import-run tests/fixtures/v1 --output-dir output
      - run: python3 tests/validate_output.py output
      - run: python3 tests/browser_check.py output/dashboard.html
