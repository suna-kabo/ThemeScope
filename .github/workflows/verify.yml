name: Verify ThemeScope

on:
  push:
    branches: [download]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements.txt"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q src scripts tests
      - run: node --check static/dashboard.js
      - run: node tests/test_dashboard.js
      - name: Clean manual-CSV install, preservation, history and HTTP site checks
        run: python tests/smoke_local_install.py --browser
