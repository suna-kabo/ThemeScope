name: Windows local setup

on:
  push:
    branches: [main]
  pull_request:

jobs:
  first-use:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the local runtime
        run: python -m pip install -r requirements-vnext.txt
      - name: Private local startup, state and backup
        run: python -m unittest discover -s tests -p test_local_first.py -v
      - name: Current launch entry points and Windows file locks
        run: |
          python -m unittest discover -s tests -p test_vnext_launch.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_vnext_market.py -v
