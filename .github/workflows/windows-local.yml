name: Windows local setup

on:
  push:
    branches: [main, download]
  pull_request:

jobs:
  first-use:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the runtime for focused tests
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements.txt"
      - name: Input selection tests
        run: python -m unittest discover -s tests -p test_local_workflow.py
      - name: Public-site boundary tests
        run: python -m unittest discover -s tests -p test_site_output.py
      - name: Direct entry-point guards and locked Pages staging
        run: |
          python -m unittest discover -s tests -p test_entry_guards.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_site_staging.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: EMA policy, holiday history and weighted research exports
        run: python -m unittest discover -s tests -p test_research_policy.py
      - name: Weighted filter and grouped export invariants
        run: python -m unittest discover -s tests -p test_refinement.py
      - name: Migration and publication rollback
        run: python -m unittest discover -s tests -p test_policy_publication.py
      - name: Preview HTTP, exclusive ports and publication recovery
        run: |
          python -m unittest discover -s tests -p test_preview.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_local_publication.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native CMD launchers, clean environment, failure preservation and history
        run: python tests/smoke_local_install.py
