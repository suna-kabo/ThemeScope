name: Windows local setup

on:
  push:
    branches: [download]
  pull_request:

jobs:
  first-use:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused input and public-site tests
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m unittest discover -s tests -p test_local_workflow.py
          python -m unittest discover -s tests -p test_site_output.py
      - name: Native CMD launchers, clean environment, failure preservation and history
        run: python tests/smoke_local_install.py
